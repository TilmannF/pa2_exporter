name: Release

# Publishes only on a version tag, so main can move without minting images.
#
# workflow_dispatch exists because nothing else exercises this file: CI runs on
# pushes and pull requests, so metadata-action, login-action and the Docker Hub
# description sync are first executed when a tag is already public. A dry run
# performs every step except the two that have outside effects, which makes an
# action upgrade testable before a release depends on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and compute tags without pushing anything"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used directly in `if:`, so they are surfaced as env
      # first. Empty means "no Docker Hub configured" and every Docker Hub step
      # is skipped — GHCR alone still publishes, and forks work untouched.
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      # 'true' only for a manual dry run; a tag push always publishes.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Normalise image names to lowercase
        # GHCR and Docker Hub both reject uppercase repository names, and
        # github.repository preserves the owner's capitalisation.
        run: |
          echo "GHCR_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USER" ]; then
            echo "DOCKERHUB_IMAGE=docker.io/$(echo "$DOCKERHUB_USER" | tr '[:upper:]' '[:lower:]')/pa2_exporter" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # One build, tagged for both registries and pushed to both.
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, latest, plus the commit SHA. The semver
          # patterns yield nothing off a tag, so a manual run needs its own
          # tag or the build would have none at all.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to the Docker Hub description
        # Without this the Docker Hub page is blank, which looks abandoned.
        # Skipped on a dry run: it rewrites the public page immediately, which
        # is the one step here with no undo.
        if: env.DOCKERHUB_USER != '' && env.DRY_RUN != 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USER }}/pa2_exporter
          short-description: ${{ github.event.repository.description }}
