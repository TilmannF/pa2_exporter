name: Release

# Publishes only on a version tag, so main can move without minting images.
#
# workflow_dispatch exists because nothing else exercises this file: CI runs on
# pushes and pull requests, so metadata-action, login-action and the Docker Hub
# description sync are first executed when a tag is already public. A dry run
# performs every step except the two that have outside effects, which makes an
# action upgrade testable before a release depends on it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and compute tags without pushing anything"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be used directly in `if:`, so they are surfaced as env
      # first. Empty means "no Docker Hub configured" and every Docker Hub step
      # is skipped — GHCR alone still publishes, and forks work untouched.
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      # 'true' only for a manual dry run; a tag push always publishes.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Normalise image names to lowercase
        # GHCR and Docker Hub both reject uppercase repository names, and
        # github.repository preserves the owner's capitalisation.
        run: |
          echo "GHCR_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USER" ]; then
            echo "DOCKERHUB_IMAGE=docker.io/$(echo "$DOCKERHUB_USER" | tr '[:upper:]' '[:lower:]')/pa2_exporter" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          # One build, tagged for both registries and pushed to both.
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, latest, plus the commit SHA. The semver
          # patterns yield nothing off a tag, so a manual run needs its own
          # tag or the build would have none at all.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=dry-run,enable=${{ github.event_name == 'workflow_dispatch' }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to the Docker Hub description
        # Without this the Docker Hub page is blank, which looks abandoned.
        # Skipped on a dry run: it rewrites the public page immediately, which
        # is the one step here with no undo.
        if: env.DOCKERHUB_USER != '' && env.DRY_RUN != 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USER }}/pa2_exporter
          short-description: ${{ github.event.repository.description }}

  # Tags without releases make a repo look abandoned: GitHub's sidebar reads
  # "No releases published" no matter how many tags exist. Runs after the image
  # so a failed build never mints a release pointing at nothing.
  release:
    needs: image
    # Tag pushes only. `github.ref_type == 'tag'` is NOT sufficient: the "Run
    # workflow" dropdown accepts a tag as its ref, so a workflow_dispatch dry
    # run launched from a tag would satisfy it and go on to mint a real
    # release — breaking the promise made at the top of this file that a dry
    # run performs every step except the ones with outside effects. The only
    # other trigger here is workflow_dispatch, so `push` means a tag push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # only this job writes; the workflow default is read
    steps:
      - uses: actions/checkout@v7

      - name: Take the release notes from CHANGELOG.md
        # The script refuses a section that is missing or that would render a
        # broken link once lifted out of the changelog. CI runs it over every
        # released version on each pull request, so a tag should never be the
        # first time it is exercised.
        run: |
          tools/changelog-section.sh "$GITHUB_REF_NAME" | tee release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
