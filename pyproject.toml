[project]
name = "pa2_exporter"
version = "0.2.0"
description = "Prometheus exporter for the dbx DriveRack PA2 loudspeaker management system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "prometheus-client>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
]

[project.scripts]
pa2-exporter = "pa2_exporter:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pa2_exporter", "pa2_poc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE", "FURB", "EXE"]
